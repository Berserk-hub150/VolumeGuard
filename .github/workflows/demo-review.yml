name: Compose storage review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: volumeguard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed merge and its parents
        uses: actions/checkout@v4
        with:
          path: proposed
          fetch-depth: 0
          persist-credentials: false
      - name: Load the installed reviewer from the base revision
        uses: actions/checkout@v4
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ./trusted
        with:
          repository-path: proposed
          compose-file: examples/mariadb/before.yaml
          comment-token: ${{ github.token }}
