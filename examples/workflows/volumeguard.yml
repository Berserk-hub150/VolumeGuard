name: Compose storage review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: volumeguard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Berserk-hub150/VolumeGuard@83bbd6a2c10d875bc24114bc72de101a8d33485c
        with:
          compose-file: compose.yaml
          comment-token: ${{ github.token }}
